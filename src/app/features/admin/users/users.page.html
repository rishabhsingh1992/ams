<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Users</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar
    placeholder="Search name, department, ID…"
    [value]="search()"
    (ionInput)="search.set($event.detail.value ?? '')"
    animated>
  </ion-searchbar>

  <div class="filter-chips">
    @for (f of filters; track f.value) {
      <button class="chip" [class.chip--active]="filter() === f.value" (click)="filter.set(f.value)">
        {{ f.label }}
      </button>
    }
  </div>

  <p class="count-label">{{ filtered().length }} user{{ filtered().length !== 1 ? 's' : '' }}</p>

  <div class="user-list">
    @for (user of filtered(); track user.id) {
      <div class="user-card" [class.user-card--inactive]="user.status === 'inactive'" (click)="openEdit(user.id)">
        <app-avatar [name]="user.fullName" [role]="user.role" size="lg"></app-avatar>
        <div class="user-info">
          <p class="user-name">{{ user.fullName }}</p>
          <p class="user-meta">{{ user.employeeId }} · {{ user.department }}</p>
          <span class="role-badge role-badge--{{ user.role }}">{{ user.role }}</span>
        </div>
        <ion-toggle
          [checked]="user.status === 'active'"
          (click)="toggleStatus(user.id, $event)">
        </ion-toggle>
      </div>
    } @empty {
      <app-empty-state icon="person-outline" message="No users found"></app-empty-state>
    }
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="addUser()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
