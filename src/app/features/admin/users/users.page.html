<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Users</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  @if (showSearch()) {
    <div class="search-bar-wrap">
      <ion-searchbar
        #searchbar
        placeholder="Search name, department, ID…"
        [value]="search()"
        (ionInput)="search.set($event.detail.value ?? '')"
        (ionCancel)="closeSearch()"
        showCancelButton="always"
        animated>
      </ion-searchbar>
    </div>
  }

  <div class="user-list">
    @for (user of filtered(); track user.id) {
      <div class="user-card" [class.user-card--inactive]="user.status === 'inactive'" (click)="openEdit(user.id)">
        <app-avatar [name]="user.fullName" [role]="user.role" size="lg"></app-avatar>
        <div class="user-info">
          <p class="user-name">{{ user.fullName }}</p>
          <p class="user-meta">{{ user.employeeId }} · {{ user.department }}</p>
          <span class="role-badge role-badge--{{ user.role }}">{{ user.role }}</span>
        </div>
        <div class="card-end">
          <span class="status-dot" [class.status-dot--active]="user.status === 'active'"></span>
          <ion-icon name="chevron-forward-outline" class="card-chevron"></ion-icon>
        </div>
      </div>
    } @empty {
      <app-empty-state icon="person-outline" message="No users found"></app-empty-state>
    }
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="start">
    <ion-fab-button color="light" (click)="toggleSearch()">
      <ion-icon [name]="showSearch() ? 'close-outline' : 'search-outline'"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</ion-content>
