<div class="rp-backdrop" (click)="dismiss()"></div>

<div class="rp-sheet">
  <div class="rp-handle"></div>

  <div class="rp-header">
    <h2 class="rp-title">Select Your Role</h2>
    <p class="rp-subtitle">Choose how you use this app</p>
  </div>

  <div class="rp-list">
    @for (role of roles; track role.value) {
      <button
        class="rp-card"
        [class.rp-card--selected]="selected === role.value"
        (click)="select(role.value)"
        type="button"
      >
        <div class="rp-card__icon-wrap">
          <ion-icon [name]="role.icon"></ion-icon>
        </div>
        <div class="rp-card__body">
          <span class="rp-card__label">{{ role.label }}</span>
          <span class="rp-card__desc">{{ role.description }}</span>
        </div>
        <div class="rp-card__check" [class.rp-card__check--visible]="selected === role.value">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" fill="var(--ion-color-primary)"/>
            <path d="M6 10l3 3 5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>
    }
  </div>

  <div class="rp-footer">
    <button class="rp-btn rp-btn--ghost" (click)="dismiss()" type="button">Cancel</button>
    <button
      class="rp-btn rp-btn--primary"
      [class.rp-btn--disabled]="!selected"
      [disabled]="!selected"
      (click)="confirm()"
      type="button"
    >
      Confirm Role
    </button>
  </div>
</div>
